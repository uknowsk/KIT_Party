# 설치 파일(APK)을 GitHub에서 자동으로 만들어요.
# - main에 올라가거나 PR이 열리면: APK를 만들어 실행 결과(Artifacts)에 첨부
# - main에 올라갔는데 pubspec.yaml의 버전(예: 1.0.0)으로 된 Release가 아직 없으면:
#   v1.0.0 Release를 만들고 APK를 올려 다운로드 링크를 만듦 (버전을 올리면 새 Release)
name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # 서명 키는 저장소 Settings → Secrets에 넣어둔 값으로 만들어요.
      # 비어 있으면 디버그 키로 서명돼요 (테스트용, 구글 로그인 안 됨).
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=kitparty"
          } > android/key.properties

      - run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk kit-party.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kit-party-apk
          path: kit-party.apk

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(grep '^version:' pubspec.yaml | sed -E 's/version: *//; s/\+.*//')"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG Release가 이미 있어서 건너뜀"
          else
            gh release create "$TAG" kit-party.apk --target "$GITHUB_SHA" --title "회비장부 $TAG" --generate-notes
          fi
